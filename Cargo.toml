[package]
name = "buntrail-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Versioned framed transport contracts and validation."
license = "MIT"
repository = "https://github.com/buntrail/buntrail-protocol"
homepage = "https://github.com/buntrail"
documentation = "https://docs.rs/buntrail-protocol"
readme = "README.md"
authors = ["Bunga Mungil <bungamungil@icloud.com>"]

[dependencies]
buntrail-core = "0.1.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.22.1"
sha2 = "=0.10.9"
